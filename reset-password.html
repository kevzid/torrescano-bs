<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Torrescano BS — Restablecimiento de contraseña.">
  
  <!-- Anti-Caché -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  
  <title>Torrescano BS — Restablecer Contraseña</title>
  <!-- Cache buster v3.1 Enterprise Dark Edition -->
  <link rel="stylesheet" href="css/styles.css?v=3.1">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏢</text></svg>">
</head>
<body class="auth-body">

  <main class="auth-layout" style="grid-template-columns: 1fr;">
    <section class="auth-form-wrapper" style="min-height: 100vh; background: radial-gradient(circle at center, #18141e 0%, #060709 100%);">
      <div class="auth-card-enterprise" style="max-width: 460px;">
        
        <div style="text-align: center; margin-bottom: 1.75rem;">
          <div class="hero-logo-box" style="margin: 0 auto 1rem auto; width: 50px; height: 50px; font-size: 1.5rem;">
            <span>🔐</span>
          </div>
          <h2 class="form-title">Nueva Contraseña</h2>
          <p class="form-subtitle">Ingresa y confirma tu nueva clave de acceso</p>
        </div>

        <form id="reset-password-form" novalidate>
          <!-- Nueva Contraseña -->
          <div class="form-group">
            <label class="form-label" for="new-password">Nueva contraseña</label>
            <div class="input-wrapper">
              <input
                type="password"
                id="new-password"
                class="form-input"
                placeholder="Mínimo 6 caracteres"
                autocomplete="new-password"
                required
              >
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
              <button type="button" class="password-toggle" data-target="new-password" aria-label="Mostrar contraseña">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
              <span class="input-error"></span>
            </div>
          </div>

          <!-- Confirmar Nueva Contraseña -->
          <div class="form-group">
            <label class="form-label" for="confirm-new-password">Confirmar nueva contraseña</label>
            <div class="input-wrapper">
              <input
                type="password"
                id="confirm-new-password"
                class="form-input"
                placeholder="Repite la contraseña"
                autocomplete="new-password"
                required
              >
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="20 6 9 17 4 12"/>
              </svg>
              <button type="button" class="password-toggle" data-target="confirm-new-password" aria-label="Mostrar contraseña">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
              <span class="input-error"></span>
            </div>
          </div>

          <!-- Botón Guardar -->
          <button type="submit" class="btn-primary btn-block btn-lg" id="btn-save-new-password" style="margin-top: 1rem;">
            <span>Guardar y Entrar</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="20 6 9 17 4 12"/>
            </svg>
          </button>
        </form>

        <p class="form-switch-prompt" style="margin-top: 1.75rem;">
          <a href="index.html">← Volver al inicio de sesión</a>
        </p>

      </div>
    </section>
  </main>

  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js?v=3.1"></script>
  <script src="js/reset-password.js?v=3.1"></script>
</body>
</html>
